  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #e8e8ec;
      min-height: 100vh;
      background: #0a0a0e;
      background-image: linear-gradient(rgba(8, 8, 12, 0.85), rgba(8, 8, 12, 0.92)), url('../assets/background.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 40px 20px 60px;
    }

    .container {
      max-width: 980px;
      width: 100%;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #8b8b9a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: 0.2s;
      animation: fadeUp 0.5s ease both;
    }
    .back-link:hover {
      color: #b8a0f0;
    }

    .project-banner {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 28px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: block;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 0.1s;
    }

    .project-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 0.2s;
    }
    .project-icon {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);

    .project-title {

    .project-desc {

      margin-bottom: 36px;
      border-left: 3px solid #7c5cbf;
      padding-left: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 0.3s;
    }
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 0.4s;
    }
    .dl-btn {
      padding: 14px 34px;
      border-radius: 40px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
      font-size: 0.95rem;
      border: 1px solid transparent;
    }
    .dl-btn:hover {
      transform: translateY(-2px);
    }
    .dl-btn.curse {
      background: rgba(249, 115, 22, 0.10);
      color: #fb923c;
      border-color: rgba(249, 115, 22, 0.15);
    }
    .dl-btn.curse:hover {
      background: rgba(249, 115, 22, 0.18);
      border-color: #f97316;
    }
    .dl-btn.mcpedl {
      background: rgba(34, 197, 94, 0.08);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.12);
    }
    .dl-btn.mcpedl:hover {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
    }

    .footer {
      margin-top: 56px;
      padding-top: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.8rem;
      color: #6a6a7a;
    }
    .footer .socials {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer .socials a {
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
    }
    .footer .socials a.discord {
      color: #5865F2;
    }
    .footer .socials a.discord:hover {
      color: #7b89f5;
    }
    .footer .socials a.curseforge {
      color: #fb923c;
    }
    .footer .socials a.curseforge:hover {
      color: #f97316;
    }
    .footer .socials a.mcpedl {
      color: #4ade80;
    }
    .footer .socials a.mcpedl:hover {
      color: #22c55e;
    }
    .footer .brand-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .footer .brand-links .sep {
      color: #3a3a44;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      body { padding: 20px 16px 40px; }
      .project-banner {
        border-radius: 10px;
        max-height: 140px;
      }
      .project-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .project-icon {
        width: 56px;
        height: 56px;
      }
      .project-title {
        font-size: 1.8rem;
      }
      .project-desc {
        font-size: 1rem;
        padding-left: 14px;
      }
      .footer {
        flex-direction: column;
        text-align: center;
      }
      .footer .socials {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">

          <a class="curseforge" href="https://www.curseforge.com/members/gameflowplayz/projects" target="_blank">CurseForge</a>
          <span class="sep">|</span>
          <a class="mcpedl" href="https://mcpedl.com/user/gameflowplayz/" target="_blank">MCPEDL</a>
        </span>
